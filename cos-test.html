<script>
const audio=document.querySelector('#audio');
const fields=Object.fromEntries(['state','startup','position','stalls','seek-wait','report'].map(id=>[id,document.getElementById(id)]));
const record={source:audio.getAttribute('src'),expectedBytes:42079163,expectedSha256:'ef45130aa968a27ee7b253887fbf33ba3d59b9914164b5be5dea4baf035cb4ca',startedAt:null,userAgent:navigator.userAgent,startupMs:null,stalls:0,lastSeekMs:null,error:null,events:[]};
let requestedAt=null,seekStartedAt=null,hasPlayed=false;
const clock=t=>Number.isFinite(t)?String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0'):'—';
function render(){fields.startup.textContent=record.startupMs===null?'—':(record.startupMs/1000).toFixed(2)+' 秒';fields.position.textContent=clock(audio.currentTime)+' / '+clock(audio.duration);fields.stalls.textContent=String(record.stalls);fields['seek-wait'].textContent=record.lastSeekMs===null?'—':(record.lastSeekMs/1000).toFixed(2)+' 秒';fields.report.textContent=JSON.stringify({...record,currentTime:audio.currentTime,duration:Number.isFinite(audio.duration)?audio.duration:null,paused:audio.paused,readyState:audio.readyState},null,2);}
function event(name){record.events.push({name,at:new Date().toISOString(),position:audio.currentTime});if(record.events.length>150)record.events.shift();render();}
document.querySelector('#play').addEventListener('click',async()=>{if(requestedAt===null){requestedAt=performance.now();record.startedAt=new Date().toISOString();}try{await audio.play();}catch(e){record.error=e.message;fields.state.textContent='播放失败：'+e.message;event('play-rejected');}});
document.querySelector('#pause').addEventListener('click',()=>audio.pause());
document.querySelector('#seek').addEventListener('click',()=>{if(Number.isFinite(audio.duration))audio.currentTime=Math.min(90,audio.duration-1);});
audio.addEventListener('play',()=>{if(requestedAt===null){requestedAt=performance.now();record.startedAt=new Date().toISOString();}fields.state.textContent='正在加载';event('play');});
audio.addEventListener('loadedmetadata',()=>{document.querySelector('#seek').disabled=false;event('loadedmetadata');});
audio.addEventListener('playing',()=>{if(record.startupMs===null&&requestedAt!==null)record.startupMs=Math.round(performance.now()-requestedAt);if(seekStartedAt!==null){record.lastSeekMs=Math.round(performance.now()-seekStartedAt);seekStartedAt=null;}hasPlayed=true;fields.state.textContent='正在播放';event('playing');});
audio.addEventListener('seeking',()=>{seekStartedAt=performance.now();fields.state.textContent='跳转中';event('seeking');});
audio.addEventListener('seeked',()=>{if(audio.paused&&seekStartedAt!==null){record.lastSeekMs=Math.round(performance.now()-seekStartedAt);seekStartedAt=null;fields.state.textContent='跳转完成，已暂停';}event('seeked');});
audio.addEventListener('waiting',()=>{if(hasPlayed&&!audio.seeking&&!audio.paused)record.stalls++;fields.state.textContent=audio.seeking?'跳转中':'等待缓冲';event('waiting');});
audio.addEventListener('pause',()=>{fields.state.textContent='已暂停';event('pause');});
audio.addEventListener('ended',()=>{fields.state.textContent='播放结束';event('ended');});
audio.addEventListener('error',()=>{record.error={code:audio.error?.code,message:audio.error?.message};fields.state.textContent='音频加载失败';event('error');});
audio.addEventListener('timeupdate',render);
render();
</script>
